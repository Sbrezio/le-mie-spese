<body>
<div class="wrap">
  <div class="top"><h1 id="ttl">Le mie spese</h1><button type="button" class="sync" id="sync"><i></i><span>Caricamento...</span></button></div>
  <button type="button" id="update" class="banner updbar" hidden>Nuova versione disponibile: tocca per aggiornare</button>
  <main id="view" class="stack"></main>
</div>
<nav class="nav" id="nav" hidden>
  <button data-tab="ins" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Inserisci</button>
  <button data-tab="mov"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Movimenti</button>

</nav>
